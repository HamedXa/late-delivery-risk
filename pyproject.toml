[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "delivery-risk"
version = "1.0.0"
description = "Late-delivery early warning for e-commerce orders, backtested month by month"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Hamed Sharafeldin" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
